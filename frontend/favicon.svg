  <line x1="16" y1="5" x2="16" y2="8" stroke="#2d6a4f" stroke-width="1" opacity="0.4"/>
  <line x1="16" y1="24" x2="16" y2="27" stroke="#2d6a4f" stroke-width="1" opacity="0.4"/>
  <line x1="5" y1="16" x2="8" y2="16" stroke="#2d6a4f" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="16" x2="27" y2="16" stroke="#2d6a4f" stroke-width="1" opacity="0.4"/>
</svg>
