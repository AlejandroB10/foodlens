# docker-compose.yml — FoodLens development environment.
#
# Prerequisites:
#   1. Build the KNN index first:
#        python -m backend.scripts.build_knn_index
#      This writes backend/data/alt_index.pkl on the host.
#   2. Copy .env.example to .env and adjust if needed (see .env.example).
#
# Usage:
#   docker compose up --build
#
# Services:
#   redis     — Redis 7 cache on localhost:6379
#   backend   — Flask API on http://localhost:5000
#   frontend  — nginx SPA on http://localhost:8080
#
# The backend/data directory is mounted read-only so the container cannot
# accidentally overwrite the host's pickle file.

services:
  redis:
    image: redis:7-alpine
    # Host port 6380 (not the default 6379) to avoid clashing with other
    # local Redis containers. The backend reaches Redis over the internal
    # compose network (redis://redis:6379), so this host mapping is only for
    # external debugging and does not affect the app.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Mount the pre-built index as read-only. Build it first on the host
      # with: python -m backend.scripts.build_knn_index
      - ./backend/data:/app/backend/data:ro
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - ALT_INDEX_PATH=/app/backend/data/alt_index.pkl
      - REDIS_URL=redis://redis:6379/0
      # TELEMETRY_PATH points outside the read-only ./backend/data mount so
      # POST /api/telemetry can persist (F-45). Default fell under the :ro mount.
      - TELEMETRY_PATH=/tmp/telemetry.jsonl
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim has no curl/wget; use the bundled Python instead, or
      # the backend stays "unhealthy" forever and the frontend never starts.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').getcode()==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (not localhost) so busybox wget uses IPv4 — nginx listens on
      # IPv4 :80, and localhost can resolve to ::1 first, giving a false "unhealthy".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
