# docker-compose.yml — FoodLens development environment.
#
# Prerequisites:
#   1. Build the KNN index first:
#        python -m backend.scripts.build_knn_index
#      This writes backend/data/alt_index.pkl on the host.
#   2. Copy .env.example to .env and adjust if needed (see .env.example).
#
# Usage:
#   docker compose up --build
#
# Services:
#   backend   — Flask API on http://localhost:5000
#   frontend  — nginx SPA on http://localhost:8080
#
# The backend/data directory is mounted read-only so the container cannot
# accidentally overwrite the host's pickle file.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Mount the pre-built index as read-only. Build it first on the host
      # with: python -m backend.scripts.build_knn_index
      - ./backend/data:/app/backend/data:ro
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - ALT_INDEX_PATH=/app/backend/data/alt_index.pkl
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
