name: f25_recently_viewed_empty_state
description: |
  Verify that on a fresh session (no history) the Recently Viewed
  section is hidden from the UI.

setup:
  - Clear browser localStorage (foodlens.recentlyViewed, foodlens.profile).

steps:
  - Open http://localhost:8080 in the browser.
  - Set completed profile in localStorage so the onboarding modal does not appear.
  - Wait for the page to finish loading.
  - Verify the Recently Viewed section is hidden (has hidden attribute).

expected_state:
  - The Recently Viewed section is not visible in the UI.
  - localStorage.getItem('foodlens.recentlyViewed') returns null.